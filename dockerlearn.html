D.core={name:"Core Concepts",intro:"How Docker really works under the hood. Understand these and every command makes sense.",
concepts:[["Docker Engine","A client–server system: the docker CLI calls the dockerd daemon through a REST API.","dockerd manages images, containers, networks and volumes. It delegates running containers to containerd, which uses runc (an OCI runtime) to create the actual process."],
["Containers vs VMs","Containers share the host kernel; VMs run a full guest OS.","Containers start in seconds and use far less memory. The trade-off is weaker isolation, because the kernel is shared."],
["Namespaces","Isolation: each container gets its own view of the system.","Linux namespaces: pid (processes), net (network stack), mnt (filesystem), uts (hostname), ipc, user. A container only sees its own process tree and interfaces."],
["cgroups","Resource limits for CPU, memory and I/O.","Control groups stop one container from starving the host. Set with --memory and --cpus."],
["Layers and union filesystem","Images are stacked read-only layers; a container adds a thin writable layer.","overlay2 merges layers. Copy-on-write: modifying a file copies it up into the writable layer. Layers are cached and shared between images, which saves disk space and build time."],
["Image identity","Addressed by name:tag and by an immutable sha256 digest.","Tags can move (latest changes over time). A digest never changes: nginx@sha256:... pins one exact image. Pin versions in production."],
["Container lifecycle","created → running → paused → exited → removed.","A container stops when its main process (PID 1) exits. Data in the writable layer is lost on docker rm, so use volumes for anything important."],
["Registry and repository","A registry hosts repositories; a repository holds the tags of one image.","Docker Hub, GHCR, ECR, GCR, or self-hosted registry:2."],
["OCI standards","Open specs for image format, runtime and distribution.","Because of OCI, images built by Docker run on containerd, Podman or Kubernetes."],

D.dockerfile.concepts.push(['Build context','Files sent to the daemon by docker build .','The trailing . is the context. COPY can only reach files inside it. Big contexts slow builds, so use .dockerignore.'],['Shell vs exec form','RUN npm start (shell) vs CMD ["npm","start"] (exec).','Exec form runs the process directly as PID 1 so it receives signals like SIGTERM. Shell form wraps it in /bin/sh -c.'],['ARG before FROM','Build variables usable in the FROM line.','ARG NODE=20 then FROM node:${NODE}. Redeclare ARG after FROM to use it inside the stage.'],['ONBUILD','A trigger that runs when this image is used as a base.','Example: ONBUILD COPY . /app. Rare, mostly for shared base images.'],['STOPSIGNAL','Signal sent by docker stop.','Default SIGTERM. Some apps (nginx) prefer SIGQUIT for graceful shutdown.'],['COPY --chown / --chmod','Set owner and mode while copying.','COPY --chown=app:app . . avoids an extra RUN chown layer.'],['BuildKit cache mounts','Reuse package caches between builds.','RUN --mount=type=cache,target=/root/.npm npm ci speeds repeated builds without bloating the image.'],['Build secrets','Use a secret at build time without storing it in a layer.','RUN --mount=type=secret,id=npmrc ... then docker build --secret id=npmrc,src=.npmrc .'],['Parser directive','First-line setting for the Dockerfile parser.','# syntax=docker/dockerfile:1 enables current BuildKit features.'],['Best practices','Quick wins.','Pin versions, small base, one process per container, order layers by change frequency, combine RUN steps, non-root USER, .dockerignore, multi-stage.']);

D.compose.concepts.push(['Top-level keys','services, networks, volumes, configs, secrets, name.','Only services is required. The others declare shared resources that services reference.'],['image vs build','Use a ready image or build from a Dockerfile.','build: {context, dockerfile, target, args}. If both are set, image: names the built result.'],['ports vs expose','ports publishes to the host; expose is container-internal only.','Quote port mappings, for example ["8080:80"], to avoid YAML parsing surprises.'],['environment / env_file','Set variables inline or from a file.','Compose also reads a .env file in the project folder for ${VAR} substitution.'],['Variable interpolation','${VAR}, ${VAR:-default}, ${VAR:?error}.','One file can serve dev and prod with different values.'],['volumes: short vs long','Named volume, bind mount, or detailed form.','pgdata:/data (named), ./src:/app (bind), or type/source/target/read_only for the long form.'],['networks','Custom networks isolate groups of services.','Put the web tier on front and back; the database joins only back.'],['depends_on + condition','Start order and readiness.','condition: service_healthy waits for a passing healthcheck. service_started is the default.'],['healthcheck','test, interval, timeout, retries, start_period.','Drives service_healthy and shows in docker compose ps.'],['restart','no, always, on-failure, unless-stopped.','Applied per service on one host.'],['command / entrypoint','Override image defaults.','command: ["npm","run","dev"]'],['profiles','Optional services started on demand.','profiles: [debug] then docker compose --profile debug up.'],['Override files','compose.override.yaml merges automatically.','Layer environments with -f compose.yaml -f prod.yaml. Later files win.'],['Extension fields and anchors','Reuse YAML with x- keys and anchors.','Define x-common: &amp;c then merge with &lt;&lt;: *c in each service.'],['develop.watch','Sync or rebuild on file changes.','docker compose watch gives a dev loop without bind mounts.'],['include / extends','Compose from other files.','include: [other/compose.yaml] pulls another project’s services in.']);

D.stack.concepts.push(['Stack file = Compose + deploy','Same format, but deploy: is honored and some keys are ignored.','Swarm ignores build, container_name, depends_on and restart (use deploy.restart_policy).'],['mode','replicated (N copies) or global (one per node).','Global suits agents such as monitoring or log shippers.'],['replicas','Number of tasks to keep running.','deploy.replicas: 3. Swarm reschedules tasks if a node dies.'],['update_config','Rolling update policy.','parallelism, delay, order (stop-first or start-first), failure_action (pause/continue/rollback), monitor.'],['rollback_config','How a rollback proceeds.','Same keys as update_config; used when failure_action is rollback.'],['restart_policy','condition, delay, max_attempts, window.','condition: none, on-failure or any.'],['resources','limits and reservations.','limits cap usage; reservations guarantee capacity so the scheduler picks suitable nodes.'],['placement','Constraints and preferences.','constraints: [node.role == worker, node.labels.disk == ssd]. preferences spread tasks across labels such as zones.'],['endpoint_mode','vip (default) or dnsrr.','vip gives one virtual IP load balanced by Swarm; dnsrr returns every task IP through DNS.'],['Ports: ingress vs host','Routing mesh or direct publish.','Long syntax: target, published, mode: host. Host mode skips the mesh and suits global services.'],['Overlay networks','driver: overlay, attachable, encrypted.','driver_opts: encrypted: true encrypts VXLAN traffic between nodes.'],['Secrets and configs','Create first, then reference as external.','docker secret create, then secrets: name: external: true. Mounted at /run/secrets/name.'],['Volumes in a swarm','Local volumes are per node.','Pin tasks with placement constraints or use a shared driver (NFS, cloud) so data follows the task.'],['Env substitution','stack deploy does not read .env by itself.','Use docker compose config | docker stack deploy -c - app, or export variables first.'],['healthcheck','Unhealthy tasks are replaced.','Needed for safe rolling updates.'],['labels','deploy.labels tag the service; labels tag containers.','Reverse proxies like Traefik read them.']);

D.swarm.concepts.push(['Raft and quorum','Managers agree on cluster state using the Raft algorithm.','A majority (N/2+1) must be reachable. 3 managers tolerate 1 failure, 5 tolerate 2. Even numbers add no safety. Without quorum you can’t change the cluster, though running tasks continue.'],['Manager high availability','Run 3 or 5 managers across failure zones.','Only the leader writes state. Never run a single manager in production. Keep managers lightly loaded.'],['Worker nodes','Run tasks only and hold no cluster state.','Cheap to add or lose. Scale workers freely.'],['Node labels','Key-value tags used for placement.','docker node update --label-add disk=ssd node2, then use the constraint node.labels.disk == ssd.'],['Node availability','active, pause or drain.','drain evacuates tasks (maintenance); pause blocks new tasks but keeps existing ones.'],['Rolling updates','Replace tasks gradually.','Flags: --update-parallelism, --update-delay, --update-order, --update-failure-action, and docker service rollback.'],['Swarm autolock','Encrypts the Raft keys at rest.','docker swarm update --autolock=true prints an unlock key. After a manager restarts, run docker swarm unlock. Store the key safely.'],['Configs','Non-sensitive config files delivered to services.','docker config create, mounted at a path you choose. Immutable: create a new config to change it.'],['Secrets','Encrypted at rest and in transit.','Mounted in memory at /run/secrets. Rotate by creating a new secret and updating the service.'],['Ingress vs host publishing','Routing mesh vs direct port on the task’s node.','ingress (default) answers on every node. host binds only where a task runs; use it with global mode.'],['Service modes','replicated or global.','Replicated = N tasks anywhere; global = one per node.'],['Join tokens and certificates','Tokens grant worker or manager role.','Rotate with docker swarm join-token --rotate worker. Node certificates rotate automatically (90 days by default).'],['Ports to open','2377/tcp management, 7946 tcp+udp node traffic, 4789/udp overlay.','Blocked ports cause join failures and broken overlay networking.']);

D.iq=[['What is Docker?','A platform that packages apps and dependencies into portable containers that run consistently anywhere.'],['Image vs container?','An image is a read-only template; a container is a running instance with a writable layer.'],['CMD vs ENTRYPOINT?','ENTRYPOINT is the fixed executable; CMD supplies default arguments that docker run can override.'],['COPY vs ADD?','COPY copies files. ADD also extracts local tars and fetches URLs. Prefer COPY.'],['How do you persist data?','Use named volumes (or bind mounts in development); the container’s writable layer is deleted with the container.'],['How do you reduce image size?','Small base images, multi-stage builds, combined RUN steps, cleaning caches and a good .dockerignore.'],['Compose vs Swarm?','Compose runs multi-container apps on one host; Swarm orchestrates services across a cluster with scaling and self-healing.'],['What is an overlay network?','A multi-host network (VXLAN) letting containers on different Swarm nodes communicate by service name.'],['How does Swarm tolerate failures?','Managers use Raft; tasks from a failed node are rescheduled. Run 3 or 5 managers to keep quorum.'],['docker stop vs kill?','stop sends SIGTERM then SIGKILL after a timeout; kill sends SIGKILL (or a chosen signal) immediately.'],['How do you handle secrets?','Use Swarm or Compose secrets and runtime injection; never bake secrets into images, ENV or ARG.'],['How do you debug a crashing container?','docker logs, docker inspect (exit code, OOMKilled), docker exec or run -it with a shell, and docker events.'],['What is a multi-stage build?','Several FROM stages in one Dockerfile; build in one and copy only the artifacts into a small final image.']];

function concepts(){var t=D[cur];
view.innerHTML='<div class="intro">'+t.intro+'</div><div class="grid">'+t.concepts.map(function(c){return '<div class="card"><h3>'+c[0]+'</h3><p>'+c[1]+'</p>'+(c[2]?'<details><summary>Details</summary><p>'+c[2]+'</p></details>':'')+'</div>'}).join("")+'</div><div class="card"><h3>Example</h3><pre>'+esc(t.snip)+'</pre></div>';}
function cmds(f){var t=D[cur];
view.innerHTML='<input type="search" id="sr" placeholder="Search commands…" value="'+esc(f)+'"><div id="cl"></div>';
var sr=document.getElementById("sr");sr.oninput=function(){list(sr.value)};list(f);}
function list(f){var t=D[cur],l=f.toLowerCase();
var r=t.cmds.filter(function(c){return (c[0]+c[1]+c[2]).toLowerCase().indexOf(l)>-1});
document.getElementById("cl").innerHTML=r.length?r.map(function(c,i){return '<div class="card"><div class="cmd"><code class="n">'+esc(c[0])+'</code><button class="cp" data-c="'+esc(c[2]).replace(/"/g,"&quot;")+'">Copy</button></div><p>'+esc(c[1])+'</p><pre>$ '+esc(c[2])+'</pre></div>'}).join(""):'<p class="meta">No commands match.</p>';}
function quiz(){var t=D[cur].quiz;
if(q.i>=t.length){sv('best:'+cur,Math.max(+ld('best:'+cur)||0,q.s));view.innerHTML='<div class="card"><div class="meta">Finished</div><div class="score">'+q.s+' / '+t.length+'</div><p>'+(q.s==t.length?"Perfect! 🎉":q.s>=t.length*0.6?"Nice work. Review the commands tab and try again.":"Keep going. Re-read the concepts and retry.")+'</p><button class="go" id="rs">Restart quiz</button></div>';return;}
var x=t[q.i];
view.innerHTML='<div class="bar"><i style="width:'+(q.i/t.length*100)+'%"></i></div><div class="card"><div class="meta">Question '+(q.i+1)+' of '+t.length+' · Score '+q.s+' · Best '+(ld('best:'+cur)||0)+'</div><h3>'+esc(x[0])+'</h3>'+x[1].map(function(o,i){return '<button class="opt" data-o="'+i+'">'+esc(o)+'</button>'}).join("")+'<div id="fb"></div></div>';}
document.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
if(b.id=="th"){var r=document.documentElement,dk=r.getAttribute("data-theme")?r.getAttribute("data-theme")=="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.setAttribute("data-theme",dk?"light":"dark");return}
if(b.dataset.k){cur=b.dataset.k;q={i:0,s:0,a:false};draw()}
else if(b.dataset.s){sec=b.dataset.s;draw()}
else if(b.dataset.c!==undefined){var c=b.dataset.c;try{navigator.clipboard.writeText(c).then(function(){b.textContent="Copied"})}catch(x){b.textContent="Select & copy"}setTimeout(function(){b.textContent="Copy"},1200)}
else if(b.dataset.o!==undefined&&!q.a){var t=D[cur].quiz[q.i],i=+b.dataset.o;q.a=true;if(i==t[2])q.s++;
document.querySelectorAll(".opt").forEach(function(o,j){o.disabled=true;if(j==t[2])o.classList.add("ok");else if(j==i)o.classList.add("no")});
document.getElementById("fb").innerHTML='<div class="fb"><b>'+(i==t[2]?"Correct! ":"Not quite. ")+'</b>'+esc(t[3])+'</div><button class="go" id="nx">'+(q.i==D[cur].quiz.length-1?"See score":"Next question")+'</button>'}
else if(b.id=="nx"){q.i++;q.a=false;quiz()}
else if(b.id=="rs"){q={i:0,s:0,a:false};quiz()}
});
draw();
</script>
</body>
</html>
